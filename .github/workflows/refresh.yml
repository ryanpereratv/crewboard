name: Refresh scores

on:
  schedule:
    - cron: "17 10 * * 1"   # Mondays 10:17 UTC (6:17 a.m. Eastern in summer, 5:17 a.m. in winter)
  workflow_dispatch:         # "Run workflow" button for an on-demand update

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest scores from Stern
        run: python refresh.py data.json
      - name: Commit new scores
        run: |
          git config user.name "crewboard-bot"
          git config user.email "crewboard-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update scores $(date -u +%Y-%m-%d)"
            git push
          fi
