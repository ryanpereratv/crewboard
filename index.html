<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard Shad Crew Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Layout: a backbox marquee up top (crew standings in dot-matrix), then the playfield grid of machines, then "next ball" call-outs. Single dark look on purpose: it's a DMD. */
:root{
  --bg:#141110; --panel:#1d1917; --panel2:#262120; --line:#3a312c;
  --fg:#efe6dc; --muted:#a3958a; --dmd:#ff8a1f; --dmd-dim:#5a3416;
  --own:#4cc38a; --close:#f2c14e; --far:#6f625a; --danger:#ff5a4e;
  --f-dot:"Doto", "Courier New", monospace;
  --f-label:"Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body:"Archivo", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:28px}
h1,h2,h3{margin:0;text-wrap:balance}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* marquee */
.marquee{background:#0c0a09;border:1px solid var(--line);border-radius:10px;padding:18px 20px 20px;
  background-image:radial-gradient(var(--dmd-dim) .8px,transparent 1px);background-size:5px 5px;background-color:#0c0a09}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.mhead h1{font-family:var(--f-dot);font-weight:900;color:var(--dmd);font-size:clamp(28px,5vw,46px);line-height:1;letter-spacing:.02em;text-shadow:0 0 12px rgba(255,138,31,.45)}
.mhead .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;font-size:15px;text-transform:uppercase;
  background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--dmd);border-color:var(--dmd);color:#1a0d02}
.tabs button:focus-visible,.mc:focus-visible{outline:2px solid var(--dmd);outline-offset:2px}
.standings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.pl{border:1px solid var(--line);border-radius:8px;padding:12px;background:rgba(20,17,16,.85);min-width:0}
.pl .name{font-family:var(--f-label);font-weight:700;font-size:18px;letter-spacing:.04em;overflow-wrap:anywhere}
.pl .big{font-family:var(--f-dot);font-weight:900;color:var(--dmd);font-size:44px;line-height:1;margin-top:4px}
.pl .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:6px}
.pl .row b{color:var(--fg);font-weight:600}
.pl.lead{border-color:var(--dmd)}
.cov{margin-top:16px;display:grid;gap:6px}
/* shoutouts */
.shout{margin-top:18px;border:1px solid var(--dmd);border-radius:8px;background:rgba(20,17,16,.9);padding:12px 14px}
.shout-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.shout-h h2{font-family:var(--f-dot);font-weight:900;color:var(--dmd);font-size:22px;letter-spacing:.04em;text-shadow:0 0 10px rgba(255,138,31,.4)}
.shout-h .lbl{font-size:12px}
.shouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.sc-card{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;background:var(--panel)}
.sc-card .rk{grid-row:span 3;font-family:var(--f-dot);font-weight:900;color:var(--dmd);font-size:38px;line-height:1}
.sc-card.gold{border-color:var(--dmd);background:linear-gradient(135deg,rgba(255,138,31,.16),var(--panel) 60%)}
.sc-card .who{font-family:var(--f-label);font-weight:700;font-size:17px;letter-spacing:.04em;overflow-wrap:anywhere}
.sc-card .what{font-size:14px;overflow-wrap:anywhere}
.sc-card .meta{font-size:12px;color:var(--muted)}
.shout .none{color:var(--muted);font-size:14px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.sc-card.gold .rk{animation:blink 1.2s steps(2,end) 3}}
@keyframes blink{50%{opacity:.25}}
.covbar{display:flex;gap:3px;flex-wrap:wrap}
.covbar i{width:14px;height:14px;border-radius:2px;background:var(--far);display:block}
.covbar i.own{background:var(--own)} .covbar i.close{background:var(--close)}
.covtxt{font-size:14px;color:var(--muted)} .covtxt b{color:var(--fg)}

/* call-outs */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.box h2{font-family:var(--f-label);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.box p.hint{margin:4px 0 12px;color:var(--muted);font-size:13px}
.list{display:grid;gap:2px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .m{font-size:13px;color:var(--muted)}
.li .r{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 7px;border-radius:999px;text-transform:uppercase}
.pill.own{background:rgba(76,195,138,.16);color:var(--own)}
.pill.close{background:rgba(242,193,78,.16);color:var(--close)}
.pill.far{background:rgba(163,149,138,.14);color:var(--muted)}
.pill.danger{background:rgba(255,90,78,.15);color:var(--danger)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* machine grid */
.gridhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.gridhead h2{font-family:var(--f-label);font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.machines{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.mc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--far);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;color:inherit;font:inherit;min-width:0;display:grid;gap:8px}
.mc.own{border-left-color:var(--own)} .mc.close{border-left-color:var(--close)}
.mc .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.mc h3{font-family:var(--f-label);font-weight:700;font-size:19px;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere}
.mc .best{font-size:14px} .mc .best b{font-weight:600}
.mc .gap{font-size:13px;color:var(--muted)}
.meter{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--far)}
.mc.own .meter span{background:var(--own)} .mc.close .meter span{background:var(--close)}
.t5{display:grid;gap:2px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.t5 div{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px}
.t5 .rk{font-family:var(--f-dot);font-weight:900;color:var(--dmd)}
.t5 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t5 .crew{color:var(--own);font-weight:600}
.t5 .sc{font-variant-numeric:tabular-nums;color:var(--muted)}
.t5 .q{color:var(--muted);font-size:11px;font-family:var(--f-label);letter-spacing:.05em}
.crewrows{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.foot{color:var(--muted);font-size:12px}

@media (max-width:820px){.standings{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.mc{transition:transform .12s ease,border-color .12s}.mc:hover{transform:translateY(-2px)}}
</style>
</head>
<body>

<div class="wrap">
  <section class="marquee" aria-label="Crew standings">
    <div class="mhead">
      <div>
        <h1>CREW BOARD</h1>
        <div class="sub">Leaderboard Shad · Stern Insider Connected · <span id="period-name"></span></div>
      </div>
      <div class="tabs" role="group" aria-label="Period">
        <button id="tab-Q1" data-p="Q1">Q1</button>
        <button id="tab-Q2" data-p="Q2">Q2</button>
        <button id="tab-Q3" data-p="Q3">Q3</button>
        <button id="tab-Q4" data-p="Q4">Q4 live</button>
        <button id="tab-Y" data-p="Y">2026 year</button>
      </div>
    </div>
    <div class="shout" id="shout" hidden>
      <div class="shout-h"><h2>NEW THIS WEEK</h2><span class="lbl" id="shout-sub"></span></div>
      <div class="shouts" id="shouts"></div>
    </div>
    <div class="standings" id="standings"></div>
    <div class="cov">
      <div class="covbar" id="covbar" aria-hidden="true"></div>
      <div class="covtxt" id="covtxt"></div>
    </div>
  </section>

  <section class="cols">
    <div class="box">
      <h2>Go play these next</h2>
      <p class="hint">Machines with no crew top-5 yet, sorted by how short the crew's best score is of 5th place.</p>
      <div class="list" id="next"></div>
    </div>
    <div class="box">
      <h2 id="side-title">Hanging on</h2>
      <p class="hint" id="side-hint"></p>
      <div class="list" id="side"></div>
    </div>
  </section>

  <section>
    <div class="gridhead">
      <h2>Every machine</h2>
      <div class="legend">
        <span><i style="background:var(--own)"></i>Crew in top 5</span>
        <span><i style="background:var(--close)"></i>Within 35% of 5th</span>
        <span><i style="background:var(--far)"></i>Further off</span>
      </div>
    </div>
    <div class="machines" id="machines"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
const CREW=['ORYAN','MRPKM','YUNGLION666','MALINAV'];
const DISP={ORYAN:'ORYAN',MRPKM:'MRPKM',YUNGLION666:'YUNGLION666',MALINAV:'MALINAV'};
const PNAME={Q1:'Q1 2026 (final)',Q2:'Q2 2026 (final)',Q3:'Q3 2026 (final)',Q4:'Q4 2026 (in progress)',Y:'Full year 2026, best score per player'};
const CLOSE=0.35;
let D=null, period='Q4';
try{const s=localStorage.getItem('crew-period'); if(s&&PNAME[s]) period=s;}catch(e){}

const fmt=n=>n.toLocaleString('en-US');
const short=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':fmt(n);
const isCrew=n=>CREW.includes(String(n).toUpperCase());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function machinesFor(p){
  const src=p==='Y'?D.y:D.q[p];
  return Object.entries(src).map(([t,v])=>{
    const crew=Object.entries(v.c).map(([u,x])=>({u,rank:x[0],score:x[1],yr:p==='Y'?null:x[2],yt:p==='Y'?null:x[3],q:p==='Y'?x[2]:p})).sort((a,b)=>a.rank-b.rank);
    const fifth=v.t5[4]?v.t5[4][1]:null;
    const best=crew[0]||null;
    let status='far', pct=null;
    if(best&&best.rank<=5) status='own';
    else if(best&&fifth){pct=(fifth-best.score)/fifth; if(pct<=CLOSE) status='close';}
    return {t,n:v.n,t5:v.t5,crew,best,fifth,status,pct};
  }).sort((a,b)=>a.t.localeCompare(b.t));
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===period));
  document.getElementById('period-name').textContent=PNAME[period];
  const ms=machinesFor(period);

  // standings
  const st=CREW.map(u=>{
    const mine=ms.map(m=>m.crew.find(c=>c.u===u)).filter(Boolean);
    return {u,top5:mine.filter(c=>c.rank<=5).length,ones:mine.filter(c=>c.rank===1).length,
      top10:mine.filter(c=>c.rank<=10).length,played:mine.length};
  });
  const max=Math.max(...st.map(s=>s.top5));
  document.getElementById('standings').innerHTML=st.map(s=>`
    <div class="pl ${s.top5===max&&max>0?'lead':''}">
      <div class="name">${DISP[s.u]}</div>
      <div class="big num">${s.top5}</div>
      <div class="lbl">top-5 spots</div>
      <div class="row"><span>#1 scores</span><b class="num">${s.ones}</b></div>
      <div class="row"><span>Top 10</span><b class="num">${s.top10}</b></div>
      <div class="row"><span>On the board (top 100)</span><b class="num">${s.played}</b></div>
    </div>`).join('');

  // coverage
  const own=ms.filter(m=>m.status==='own').length, close=ms.filter(m=>m.status==='close').length;
  document.getElementById('covbar').innerHTML=[...ms].sort((a,b)=>({own:0,close:1,far:2}[a.status]-{own:0,close:1,far:2}[b.status])).map(m=>`<i class="${m.status}" title="${esc(m.t)}"></i>`).join('');
  document.getElementById('covtxt').innerHTML=`Crew holds a top-5 spot on <b>${own} of ${ms.length}</b> machines. <b>${close}</b> more are within reach, and <b>${ms.length-own-close}</b> still need work.`;

  // next up
  const next=ms.filter(m=>m.status!=='own'&&m.best).sort((a,b)=>a.pct-b.pct).slice(0,8);
  const none=ms.filter(m=>!m.best);
  document.getElementById('next').innerHTML=next.length?next.map(m=>`
    <div class="li"><div><div class="t">${esc(m.t)}</div><div class="m">${DISP[m.best.u]} sits #${m.best.rank} with ${short(m.best.score)}${period==='Y'?' ('+m.best.q+')':''}. 5th is ${short(m.fifth)}.</div></div>
    <div class="r"><span class="pill ${m.status}">${Math.round(m.pct*100)}% short</span><div class="m">+${short(m.fifth-m.best.score)}</div></div></div>`).join('')
    +(none.length?`<div class="li"><div><div class="t">No crew score yet</div><div class="m">${none.map(m=>esc(m.t)).join(', ')}</div></div><div class="r"><span class="pill far">Unplayed</span></div></div>`:'')
    :'<div class="empty">Every machine has a crew top-5. Nice.</div>';

  // side box
  const side=document.getElementById('side');
  if(period==='Y'){
    document.getElementById('side-title').textContent='Quarter top-5s vs. the year';
    document.getElementById('side-hint').textContent='Every crew top-5 from any quarter, ranked against all scores posted on that machine in 2026 (every quarter combined).';
    const rows=[];
    ['Q1','Q2','Q3','Q4'].forEach(q=>Object.entries(D.q[q]).forEach(([t,v])=>Object.entries(v.c).forEach(([u,x])=>{if(x[0]<=5) rows.push({q,t,u,qr:x[0],s:x[1],yr:x[2],yt:x[3]})})));
    rows.sort((a,b)=>a.yr/a.yt-b.yr/b.yt);
    side.innerHTML=rows.map(r=>`<div class="li"><div><div class="t">${esc(r.t)}</div><div class="m">${DISP[r.u]} · #${r.qr} in ${r.q} · ${short(r.s)}</div></div>
      <div class="r"><span class="pill ${r.yr<=5?'own':r.yr<=20?'close':'far'}">#${r.yr} of ${r.yt}</span><div class="m">for the year</div></div></div>`).join('');
  } else {
    document.getElementById('side-title').textContent='Hanging on';
    document.getElementById('side-hint').textContent='Crew spots at #4 or #5 this quarter, with how far they trail the score above. One good game from someone else knocks these off.';
    const rows=[];
    ms.forEach(m=>m.crew.forEach(c=>{if(c.rank>=4&&c.rank<=5){const above=m.t5[c.rank-2][1]; rows.push({m,c,need:above-c.score,above:m.t5[c.rank-2][0]})}}));
    rows.sort((a,b)=>b.c.rank-a.c.rank||a.need-b.need);
    side.innerHTML=rows.length?rows.map(r=>`<div class="li"><div><div class="t">${esc(r.m.t)}</div><div class="m">${DISP[r.c.u]} · ${short(r.c.score)} · ${short(r.need)} behind ${esc(r.above)}</div></div>
      <div class="r"><span class="pill ${r.c.rank===5?'danger':'close'}">#${r.c.rank}</span><div class="m">year #${r.c.yr} of ${r.c.yt}</div></div></div>`).join('')
      :'<div class="empty">No crew spots at #4 or #5 this quarter.</div>';
  }

  // machine cards
  document.getElementById('machines').innerHTML=ms.map(m=>{
    const fill=m.status==='own'?100:m.pct==null?0:Math.max(4,Math.round((1-m.pct)*100));
    const head=m.best?(m.best.rank<=5?`<b>${DISP[m.best.u]}</b> holds #${m.best.rank} with ${short(m.best.score)}`:`Best: <b>${DISP[m.best.u]}</b> #${m.best.rank}, ${short(m.best.score)}`):'No crew score in the top 100';
    const gap=m.status==='own'?(m.best.rank===1?'Top of the board':`${short(m.t5[m.best.rank-2][1]-m.best.score)} behind #${m.best.rank-1}`):m.best?`${Math.round(m.pct*100)}% short of 5th (${short(m.fifth)})`:`5th place is ${short(m.fifth||0)}`;
    const crewline=m.crew.map(c=>`${DISP[c.u]} #${c.rank}`).join(' · ');
    return `<button class="mc ${m.status}" id="mc-${m.t.replace(/[^a-z0-9]/gi,'')}" aria-expanded="false">
      <div class="top"><h3>${esc(m.t)}</h3><span class="pill ${m.status}">${m.status==='own'?'Crew':m.status==='close'?'Close':'Far'}</span></div>
      <div class="best">${head}</div>
      <div class="meter"><span style="width:${fill}%"></span></div>
      <div class="gap">${gap} · ${m.n} ${period==='Y'?'players':'scores'}</div>
      <div class="t5" hidden>${m.t5.map((r,i)=>`<div><span class="rk">${i+1}</span><span class="nm ${isCrew(r[0])?'crew':''}">${esc(r[0])}${period==='Y'?` <span class="q">${r[2]}</span>`:''}</span><span class="sc">${fmt(r[1])}</span></div>`).join('')}
        ${crewline?`<div class="crewrows">${crewline}</div>`:''}</div>
    </button>`;}).join('');
  document.querySelectorAll('.mc').forEach(b=>b.addEventListener('click',()=>{const t=b.querySelector('.t5');t.hidden=!t.hidden;b.setAttribute('aria-expanded',!t.hidden)}));

  document.getElementById('foot').textContent=`Data pulled from Stern Insider Connected on ${new Date(D.fetched).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})}. Stern's feed lists the top 100 per machine, so a crew score below 100th won't show. Tap a machine to see its top 5.`;
}

document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{period=b.dataset.p;try{localStorage.setItem('crew-period',period)}catch(e){}render()}));
function renderShouts(h){
  const box=document.getElementById('shout'); if(!h) return;
  const week=Date.now()-7*864e5;
  const ev=(h.events||[]).filter(e=>Date.parse(e.at)>=week)
    .sort((a,b)=>a.rank-b.rank||Date.parse(b.at)-Date.parse(a.at));
  const day=iso=>{const d=new Date(Date.parse(iso)-6*36e5);return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
  document.getElementById('shout-sub').textContent=ev.length?`${ev.length} new crew top-5 ${ev.length===1?'spot':'moves'} in the last 7 days`:'';
  document.getElementById('shouts').innerHTML=ev.length?ev.map(e=>{
    const line=e.kind==='new'?(e.rank===1?'Took #1 on':'Cracked the top 5 on'):(e.rank===1?`Climbed from #${e.prev} to #1 on`:`Climbed from #${e.prev} to #${e.rank} on`);
    return `<div class="sc-card ${e.rank===1?'gold':''}"><span class="rk">#${e.rank}</span>
      <span class="who">${DISP[e.u]||esc(e.u)}</span><span class="what">${line} <b>${esc(e.t)}</b></span>
      <span class="meta num">${short(e.score)} · ${day(e.at)}</span></div>`;}).join('')
    :`<div class="none">No new crew top-5 spots in the last 7 days. ${Date.parse(h.since)>week?'Tracking started '+new Date(h.since).toLocaleDateString('en-US',{month:'short',day:'numeric'})+', so shoutouts show up after the nightly update.':'Go get one.'}</div>`;
  box.hidden=false;
}
fetch('history.json').then(r=>r.ok?r.json():null).then(renderShouts).catch(()=>{});
fetch('data.json').then(r=>r.json()).then(d=>{D=d;render()}).catch(()=>{document.getElementById('covtxt').textContent='Could not load the score data.'});
</script>

</body>
</html>
